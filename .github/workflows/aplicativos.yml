# Gera os aplicativos para Windows (.zip com CalculadorDeGastos.exe) e Ubuntu
# (.tar.gz com o programa e o instalar-ubuntu.sh).
# - push na main ou "Run workflow": os arquivos ficam em Actions > (execução) > Artifacts
# - tag v* (ex.: git tag v1.0 && git push origin v1.0): vão também para a Release
name: Aplicativos

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # necessário só para publicar a Release nas tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arquivo: CalculadorDeGastos-windows.zip
            separador: ";"
          - os: ubuntu-latest
            arquivo: CalculadorDeGastos-ubuntu.tar.gz
            separador: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Testes
        run: python test_calculador.py

      - name: Gerar executável
        # --onedir (padrão) abre mais rápido e dá menos alarme falso de antivírus
        # que --onefile; --collect-data leva os temas/fontes do CustomTkinter;
        # PIL._tkinter_finder é carregado só ao desenhar logos (o PyInstaller não
        # o detecta sozinho e o app fechava ao abrir com rendas de delivery)
        run: >
          pyinstaller --noconfirm --windowed --name CalculadorDeGastos
          --collect-data customtkinter
          --hidden-import PIL._tkinter_finder
          --add-data "assets/icone.png${{ matrix.separador }}assets"
          calculador.py

      - name: Abrir o executável (Ubuntu)
        # abre o app empacotado por 20 s com uma renda de delivery e um logo, para
        # pegar módulo faltando no pacote; "timeout" encerrar (124) = não fechou
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          mkdir -p teste/CalculadorGastos/logos
          cp assets/icone.png teste/CalculadorGastos/logos/ifood.png
          python -c "import json; d = json.load(open('gastos.exemplo.json', encoding='utf-8')); d['rendas'].append({'data': '10/09/2026', 'descricao': 'Delivery - iFood', 'fonte': 'Delivery / Apps', 'app': 'iFood', 'valor': 300.0}); json.dump(d, open('teste/CalculadorGastos/gastos.json', 'w', encoding='utf-8'))"
          set +e
          XDG_DATA_HOME="$PWD/teste" timeout 20 xvfb-run -a dist/CalculadorDeGastos/CalculadorDeGastos
          codigo=$?
          set -e
          if [ "$codigo" -ne 124 ]; then echo "O app fechou sozinho (código $codigo)"; exit 1; fi

      - name: Compactar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/CalculadorDeGastos -DestinationPath ${{ matrix.arquivo }}

      - name: Compactar (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cp empacotamento/instalar-ubuntu.sh dist/
          tar -czf ${{ matrix.arquivo }} -C dist CalculadorDeGastos instalar-ubuntu.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arquivo }}
          path: ${{ matrix.arquivo }}

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.arquivo }}
